# Production requires a managed Temporal namespace and off-host backups (see docs/06-deploy.md).
x-app-env: &app-env
  MONGO_URL: mongodb://${MONGO_APP_USER:?set MONGO_APP_USER}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}@mongo:27017/technews?authSource=technews
  MONGO_DB: technews
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:?set managed Temporal address}
  TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:?set managed Temporal API key}
  TEMPORAL_TLS: "true"
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:?set managed Temporal namespace}
  GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
  VAPID_SUBJECT: ${VAPID_SUBJECT}
  BOT_INFO_URL: ${BOT_INFO_URL:-https://${DOMAIN}}

services:
  caddy:
    image: caddy:2.9.1@sha256:748016f285ed8c43a9ce6e3aed6d92d3009d90ca41157950880f40beaf3ff62b
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN}" }
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: https://${DOMAIN}/api/v1
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    environment:
      <<: *app-env
      API_PORT: "4000"
      WEB_ORIGINS: https://${DOMAIN}
      TRUST_PROXY: "1"
      PUBLIC_LLM_DAILY_CAP: ${PUBLIC_LLM_DAILY_CAP:-100}
      REFRESH_ADMIN_UIDS: ${REFRESH_ADMIN_UIDS:?set REFRESH_ADMIN_UIDS}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    environment:
      <<: *app-env
      LLM_CALLS_PER_SECOND: ${LLM_CALLS_PER_SECOND:-1}
      WORKER_LLM_DAILY_CAP: ${WORKER_LLM_DAILY_CAP:-800}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  mongo:
    image: mongo:8.0.15@sha256:f4d54619262ae3bc6a0a8efbebcef970b87b8ad70697479a75ce308a6f400158
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER:?set MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}
      MONGO_BACKUP_USER: ${MONGO_BACKUP_USER:?set MONGO_BACKUP_USER}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:?set MONGO_BACKUP_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", 'mongosh --quiet --username "$$MONGO_APP_USER" --password "$$MONGO_APP_PASSWORD" --authenticationDatabase technews --eval "db.adminCommand({ping:1})" >/dev/null']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8.0.2-alpine@sha256:48501c5ad00d5563bc30c075c7bcef41d7d98de3e9a1e6c752068c66f0a8463b
    restart: unless-stopped
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD:?set REDIS_PASSWORD}" }
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
  redis-data:
  caddy-data:
  caddy-config:
